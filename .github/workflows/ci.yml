name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:colors
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm smoke:images
